name: Aviso Sul - avisos INMET y SMN
on:
  workflow_dispatch:
    inputs:
      modo: {description: "nuevos, manana o vispera", default: "nuevos"}
  # la programacion corre en Hostinger (tarea cada 10 min); aca queda solo la corrida manual
permissions:
  contents: write
concurrency:
  group: avisosul
  cancel-in-progress: false
jobs:
  agente:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Elegir modo
        id: m
        run: |
          case "${{ github.event.schedule }}" in
            "30 9 * * *") echo "modo=manana" >> "$GITHUB_OUTPUT" ;;
            "0 23 * * *") echo "modo=vispera" >> "$GITHUB_OUTPUT" ;;
            *) echo "modo=${{ github.event.inputs.modo || 'nuevos' }}" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Correr agente de Brasil (INMET)
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_OWNER: ${{ secrets.TELEGRAM_OWNER }}
          TELEGRAM_CANAL_FOZ: ${{ secrets.TELEGRAM_CANAL_FOZ }}
          PUBLICAR: ${{ vars.PUBLICAR }}
        run: python3 agente_inmet.py "${{ steps.m.outputs.modo }}"
      - name: Correr agente de Argentina (SMN)
        continue-on-error: true
        if: steps.m.outputs.modo == 'nuevos'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_OWNER: ${{ secrets.TELEGRAM_OWNER }}
          TELEGRAM_CANAL_IGUAZU: ${{ secrets.TELEGRAM_CANAL_IGUAZU }}
          TELEGRAM_CANAL_CORDOBA: ${{ secrets.TELEGRAM_CANAL_CORDOBA }}
          PUBLICAR: ${{ vars.PUBLICAR }}
        run: python3 agente_smn.py nuevos
      - name: Condiciones de ahora y proxima hora (MET Norway)
        continue-on-error: true
        if: steps.m.outputs.modo == 'nuevos'
        env:
          AVISOSUL_CONTACTO: ${{ vars.AVISOSUL_CONTACTO }}
        run: python3 agente_tiempo.py
      - name: Guardar avisos ya vistos
        run: |
          git config user.name "avisosul-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "estado" && git push)
